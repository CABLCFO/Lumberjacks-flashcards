<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumberjacks Defense Flash Cards</title><meta name="theme-color" content="#05080A">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#05080A;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid #00C8E0;box-shadow:0 3px 0 #6A3FA0}
header img{width:44px;height:44px}header h1{font-size:20px;margin:0;letter-spacing:1px;font-weight:900}
header small{display:block;color:#00C8E0;font-size:12px;font-weight:700;letter-spacing:1px}
.score{margin-left:auto;text-align:right;font-weight:800;color:#F2B705;font-size:15px}
main{max-width:560px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pbtn{background:#0e1418;border:2px solid #00AECB;color:#fff;border-radius:14px;padding:14px 4px;font-size:22px;font-weight:900;min-height:78px;cursor:pointer}
.pbtn span{display:block;font-size:11px;font-weight:600;color:#9fb;color:#8fd8e4;margin-top:3px}
.pbtn.all{grid-column:1/-1;background:linear-gradient(90deg,#00AECB,#00C8E0);color:#05080A;border:none}
.pbtn.all span{color:#05080A}
.btn{background:#00C8E0;color:#05080A;border:none;border-radius:12px;font-weight:800;font-size:16px;padding:14px;min-height:52px;cursor:pointer}
.btn.ghost{background:transparent;color:#00C8E0;border:2px solid #00AECB}.btn.y{background:#F2B705}
.row{display:flex;gap:8px;margin-top:12px}.row .btn{flex:1}
.card{perspective:1200px;cursor:pointer}
.inner{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:300px}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#0e1418;border:2px solid #00AECB;border-radius:18px;padding:16px;display:flex;flex-direction:column}
.back{transform:rotateY(180deg);border-color:#F2B705;position:relative}
.front{position:relative}.card.flip .front{position:absolute}.card:not(.flip) .back{position:absolute}
.tag{display:inline-block;background:#6A3FA0;color:#fff;font-weight:800;border-radius:8px;padding:4px 10px;font-size:14px}
.top{display:flex;align-items:center;gap:12px;margin:10px 0}
.facts div{font-size:15px;margin:3px 0;color:#cfe}.facts b{color:#F2B705}
.hit{font-size:22px;font-weight:900;margin:8px 0;line-height:1.2}
.q{color:#00C8E0;font-size:20px;font-weight:900;margin-top:auto}.hint{color:#789;font-size:12px}
.ans{font-size:21px;font-weight:800;line-height:1.3;margin:8px 0}
.key{font-size:13px;color:#F2B705;white-space:pre-line;border-left:3px solid #6A3FA0;padding-left:8px;margin-top:8px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ch{background:#111a1f;color:#fff;border:2px solid #29424a;border-radius:12px;padding:13px;font-size:16px;text-align:left;min-height:52px;cursor:pointer}
.ch.ok{border-color:#2ecc71;background:#103a22}.ch.no{border-color:#e4572e;background:#3a1610}
.fb{font-weight:900;font-size:18px;margin-top:10px;min-height:22px}
svg.f{width:100%;max-width:330px;display:block;margin:6px auto 0}
.why{font-size:15px;line-height:1.35;color:#e8f6f8;margin:8px 0 4px;background:#111a1f;border-radius:10px;padding:8px 10px}.why b{color:#F2B705}.muted{color:#789;font-size:13px;text-align:center;margin-top:14px}
footer{text-align:center;color:#6A3FA0;font-weight:800;letter-spacing:2px;font-size:12px;padding:18px}
</style></head><body>

const RULES=[{"q": "Runner on 1st. Ground ball to SS. Is the play at 2nd a force or a tag?", "a": "Force: step on 2nd with the ball", "o": ["Tag the runner", "No play at 2nd", "Throw to 3rd"], "e": "The batter runs to 1st, so the runner on 1st MUST go to 2nd. That's a force: step on the bag."}, {"q": "Runner on 2nd only. Ground ball to 3B. Play at 3rd?", "a": "Tag: no force at 3rd", "o": ["Force: step on 3rd", "Step on 2nd", "Runner is out automatically"], "e": "1st base is empty, so the runner on 2nd doesn't have to run. No force, so you must tag him."}, {"q": "Bases loaded, ground ball. Where are the forces?", "a": "Every base, including home", "o": ["Only 1st", "Only home", "No forces"], "e": "Every runner has to move up, so you can step on any base, even home."}, {"q": "Runners on 1st & 3rd. Ground ball to 2B. Where's the force?", "a": "2nd and 1st only", "o": ["Home", "3rd", "Every base"], "e": "Runner on 3rd isn't forced (2nd is empty behind him). Forces are only at 2nd and 1st."}, {"q": "Runner on 1st only. Ground ball to 3B. Can 3B step on 3rd for a force out?", "a": "No: nobody is forced to 3rd", "o": ["Yes, always", "Only with 2 outs", "Only if he catches it in the air"], "e": "The runner on 1st is only forced to 2nd. To get an out at 3rd you'd need runners on 1st AND 2nd."}, {"q": "A force goes away when...", "a": "The runner behind is put out first", "o": ["The ball is thrown", "The runner slides", "The coach yells"], "e": "If you get the batter out at 1st first, the runner going to 2nd is no longer forced. Now you must tag him."}, {"q": "Runners on 1st & 2nd, 0 outs. High pop-up the SS can catch easily. What is it?", "a": "Infield fly: the batter is out", "o": ["A live ball, runners must run", "A foul ball", "A dead ball"], "e": "Infield fly = less than 2 outs, runners on 1st & 2nd (or loaded), fair pop-up an infielder can catch easily. Batter is out even if dropped. (Check your league: some 9U leagues don't use it.)"}, {"q": "Runner on 1st only, 0 outs const NAMES={P:"Pitcher",C:"Catcher","1B":"First Base","2B":"Second Base","3B":"Third Base",SS:"Shortstop",LF:"Left Field",CF:"Center Field",RF:"Right Field"};

const CARDS=[];
